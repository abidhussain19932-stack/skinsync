services:
  - type: web
    name: skinsync
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: YOUCAM_API_KEY
        sync: false
      - key: YOUCAM_BASE_URL
        value: https://yce-api-01.makeupar.com
      # DEMO_MODE defaults to on when YOUCAM_API_KEY is empty, off when it is set.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: PYTHON_VERSION
        value: 3.12.7
